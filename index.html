<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Marine Engineering - Sea Level to Chief Engineer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        marine: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            600: '#0284c7',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#031c30', // Custom Ultra-deep Ocean
                        },
                        steel: {
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#090d16'
                        },
                        safety: '#f59e0b' // Safety yellow / accent gold
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-steel-950 text-slate-100 font-sans leading-relaxed selection:bg-marine-600 selection:text-white antialiased">

    <!-- NAVIGATION BAR -->
    <nav class="sticky top-0 z-40 bg-steel-950/90 backdrop-blur-md border-b border-marine-900/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">
                <div class="flex items-center gap-3">
                    <!-- Custom SVG Propeller Logo -->
                    <div class="bg-gradient-to-tr from-marine-600 to-cyan-400 p-2.5 rounded-xl shadow-lg shadow-marine-600/20 flex items-center justify-center">
                        <svg class="w-6 h-6 text-white animate-[spin_10s_linear_infinite]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707.707M12 12a3 3 0 100-6 3 3 0 000 6zm0 0a3 3 0 110 6 3 3 0 010-6z" />
                        </svg>
                    </div>
                    <div>
                        <span class="text-lg sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-100 to-marine-100">
                            BASIC MARINE
                        </span>
                        <div class="text-[10px] tracking-widest text-marine-600 font-bold uppercase -mt-1">ENGINEERING</div>
                    </div>
                </div>

                <!-- Desktop Nav Links -->
                <div class="hidden md:flex items-center space-x-8 text-sm font-medium">
                    <a href="#home" class="text-slate-300 hover:text-white transition duration-200">Home</a>
                    <a href="#videos" class="text-slate-300 hover:text-white transition duration-200">Videos</a>
                    <a href="#courses" class="text-slate-300 hover:text-white transition duration-200">Courses</a>
                    <a href="#merch" class="text-slate-300 hover:text-white transition duration-200">Merch Store</a>
                    <a href="#about" class="text-slate-300 hover:text-white transition duration-200">About</a>
                </div>

                <!-- Right Nav Elements: Cart + Subscribe Link -->
                <div class="flex items-center gap-4">
                    <!-- Shopping Cart Button -->
                    <button onclick="toggleCartModal()" class="relative p-2.5 text-slate-300 hover:text-white hover:bg-steel-800 rounded-xl transition-all border border-transparent hover:border-marine-900/50" aria-label="Shopping Cart">
                        <i class="fa-solid fa-cart-shopping text-lg"></i>
                        <span id="cart-counter" class="absolute -top-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-cyan-500 text-[10px] font-bold text-steel-950 ring-2 ring-steel-950 transition-all scale-0">0</span>
                    </button>

                    <!-- Subscribe Button -->
                    <a href="https://www.youtube.com/user/hestondias1" target="_blank" class="hidden sm:inline-flex items-center gap-2 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white px-5 py-2 rounded-xl text-sm font-bold tracking-wide transition-all duration-150 transform active:scale-95 shadow-lg shadow-red-600/20">
                        <i class="fa-brands fa-youtube text-lg"></i> Subscribe
                    </a>

                    <!-- Mobile Menu Button -->
                    <button onclick="toggleMobileMenu()" class="md:hidden p-2.5 text-slate-300 hover:text-white hover:bg-steel-800 rounded-xl transition duration-150" aria-label="Toggle Menu">
                        <i id="menu-icon" class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Nav Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-steel-900 border-t border-marine-900/40 px-4 py-4 space-y-3 transition duration-150">
            <a href="#home" onclick="toggleMobileMenu()" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-steel-800 font-medium transition duration-150">Home</a>
            <a href="#videos" onclick="toggleMobileMenu()" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-steel-800 font-medium transition duration-150">Videos</a>
            <a href="#courses" onclick="toggleMobileMenu()" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-steel-800 font-medium transition duration-150">Courses</a>
            <a href="#merch" onclick="toggleMobileMenu()" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-steel-800 font-medium transition duration-150">Merch Store</a>
            <a href="#about" onclick="toggleMobileMenu()" class="block px-4 py-2.5 rounded-lg text-slate-300 hover:text-white hover:bg-steel-800 font-medium transition duration-150">About</a>
            <a href="https://www.youtube.com/user/hestondias1" target="_blank" onclick="toggleMobileMenu()" class="flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white w-full py-3 rounded-lg text-sm font-bold tracking-wide transition">
                <i class="fa-brands fa-youtube text-lg"></i> Subscribe on YouTube
            </a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <!-- (content unchanged for brevity in this file; full site provided in assets/js and css) -->

    <!-- Include site JS -->
    
    <script src="assets/js/app.js" defer></script>
</body>
</html>
